spring.application.name=viagens-igreja

# Em producao, configure DB_URL com uma URL JDBC completa:
# jdbc:mysql://host:3306/banco
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/viagensigreja_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# O Render informa a porta publica por meio da variavel PORT.
server.port=${PORT:8080}
